[project]
name = "endless-vgm-stage1-poc"
version = "0.1.0"
description = "Stage 1 PyMusicLooper sampling and analysis PoC"
requires-python = ">=3.12"

[project.scripts]
stage1-poc = "stage1_poc.runner:main"
stage1-review = "stage1_poc.review_server:main"
stage1-build-evaluation = "stage1_poc.evaluation_builder:main"
stage1-evaluate = "stage1_poc.evaluation:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.4,<9",
    "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/stage1_poc"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
