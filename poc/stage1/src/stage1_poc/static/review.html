<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Stage 1 ループ聴感レビュー</title>
    <link rel="stylesheet" href="/review.css">
  </head>
  <body>
    <main>
      <header>
        <div>
          <p class="eyebrow">ENDLESS VIDEO GAME MUSIC · STAGE 1</p>
          <h1>ループ聴感レビュー</h1>
        </div>
        <div id="progress" class="progress">読込中</div>
      </header>

      <section class="instructions">
        <strong>スコアは判定材料にしません。</strong>
        境界が自然なら「ループ対応」、曲自体がループ曲でなければ「ループ非対応」、
        ループ曲だが検出位置が不自然なら「ループ曲だが点がおかしい」を選びます。
      </section>

      <section class="review-card">
        <div class="track-position" id="track-position">— / —</div>
        <p id="evaluation-group" class="evaluation-group" hidden></p>
        <h2 id="title">読込中</h2>
        <p id="album" class="album"></p>
        <p id="artist" class="artist"></p>

        <dl class="analysis">
          <div>
            <dt>解析結果</dt>
            <dd id="analysis-status">—</dd>
          </div>
          <div>
            <dt>ループ開始</dt>
            <dd id="loop-start">—</dd>
          </div>
          <div>
            <dt>ループ終了</dt>
            <dd id="loop-end">—</dd>
          </div>
        </dl>

        <div class="preview">
          <button id="preview-button" class="primary" type="button">
            境界の5秒前からループ試聴
          </button>
          <button id="stop-button" type="button">停止</button>
          <span id="preview-status" role="status"></span>
        </div>

        <div id="boundary-monitor" class="boundary-monitor">
          <div class="boundary-readout">
            <span>ループ境界</span>
            <strong id="boundary-countdown">停止中</strong>
          </div>
          <div class="boundary-track" aria-hidden="true">
            <span id="boundary-progress"></span>
          </div>
          <div id="boundary-flash" class="boundary-flash" aria-live="assertive"></div>
        </div>

        <details>
          <summary>曲全体を確認する</summary>
          <audio id="full-player" controls preload="metadata"></audio>
        </details>

        <div class="labels" aria-label="聴感ラベル">
          <button id="loop-button" class="label loop" type="button">ループ対応</button>
          <button id="non-loop-button" class="label non-loop" type="button">
            ループ非対応
          </button>
          <button id="bad-points-button" class="label bad-points" type="button">
            おそらくループ対応だが<br>いまのループ点はおかしい
          </button>
          <button id="clear-button" class="label clear" type="button">判定を消す</button>
        </div>
      </section>

      <nav>
        <button id="previous-button" type="button">前の曲</button>
        <button id="next-unlabeled-button" type="button">次の未判定</button>
        <button id="next-button" type="button">次の曲</button>
      </nav>

      <p id="message" class="message" role="status"></p>
    </main>
    <script type="module" src="/review.js"></script>
  </body>
</html>
