[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "endless-video-game-music"
version = "0.1.0"
description = "A local Music.app player with automatic seamless looping."
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [{name = "shinderuman"}]
dependencies = [
  "numpy>=1.25.0",
  "pymusiclooper==3.6.0",
  "scipy>=1.13.0",
]

[project.scripts]
endless-vgm = "endless_vgm.__main__:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "ruff>=0.9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/endless_vgm"]

[tool.hatch.build]
include = [
  "src/endless_vgm/**/*.py",
  "src/endless_vgm/scripts/*",
  "src/endless_vgm/static/*",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
