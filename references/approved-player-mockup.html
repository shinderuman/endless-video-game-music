<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ゲーム音楽ループプレイヤー — UI試作</title>
<style>
:root {
  color-scheme: dark;
  --bg: #0b0e13;
  --panel: #121721;
  --panel-strong: #181f2b;
  --panel-soft: #0f141d;
  --border: #293242;
  --border-strong: #3a465a;
  --text: #f4f6fa;
  --muted: #98a4b7;
  --subtle: #69758a;
  --accent: #7c9cff;
  --accent-strong: #9bb1ff;
  --accent-soft: rgba(124, 156, 255, 0.14);
  --success: #73d5a4;
  --warning: #f6c76a;
  --danger: #f28b82;
  --shadow: 0 22px 70px rgba(0, 0, 0, 0.34);
  --radius: 16px;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Yu Gothic UI", "Yu Gothic", sans-serif;
}
* {
  box-sizing: border-box;
}
html {
  min-height: 100%;
  background: var(--bg);
}
body {
  min-height: 100vh;
  margin: 0;
  color: var(--text);
  background:
    radial-gradient(circle at 15% -20%, rgba(124, 156, 255, 0.14), transparent 35%),
    radial-gradient(circle at 95% 0%, rgba(82, 201, 151, 0.08), transparent 28%),
    var(--bg);
}
button,
input {
  font: inherit;
}
button {
  color: inherit;
}
button:focus-visible,
input:focus-visible {
  outline: 3px solid rgba(124, 156, 255, 0.38);
  outline-offset: 2px;
}
.app {
  width: min(1420px, calc(100% - 32px));
  margin: 0 auto;
  padding: 26px 0 180px;
}
.header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
  margin-bottom: 24px;
}
.brand {
  min-width: 0;
}
.brand-line {
  display: flex;
  align-items: center;
  gap: 12px;
}
.brand-mark {
  display: grid;
  place-items: center;
  width: 42px;
  height: 42px;
  border: 1px solid rgba(124, 156, 255, 0.45);
  border-radius: 13px;
  background: linear-gradient(145deg, rgba(124, 156, 255, 0.22), rgba(124, 156, 255, 0.05));
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.07);
  font-weight: 800;
  letter-spacing: -0.04em;
}
h1 {
  margin: 0;
  font-size: clamp(20px, 2vw, 27px);
  letter-spacing: -0.03em;
}
.subtitle {
  margin: 5px 0 0 54px;
  color: var(--muted);
  font-size: 13px;
}
.header-actions {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 10px;
  flex-wrap: wrap;
}
.status-pill {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  min-height: 36px;
  padding: 0 12px;
  border: 1px solid var(--border);
  border-radius: 999px;
  color: var(--muted);
  background: rgba(18, 23, 33, 0.78);
  font-size: 12px;
  white-space: nowrap;
}
.status-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--warning);
  box-shadow: 0 0 0 4px rgba(246, 199, 106, 0.12);
}
.status-pill.loaded .status-dot {
  background: var(--success);
  box-shadow: 0 0 0 4px rgba(115, 213, 164, 0.12);
}
.secondary-button,
.ghost-button,
.icon-button,
.primary-button {
  border: 1px solid var(--border);
  border-radius: 11px;
  cursor: pointer;
  transition: border-color 140ms ease, background 140ms ease, transform 140ms ease, opacity 140ms ease;
}
.secondary-button {
  min-height: 38px;
  padding: 0 14px;
  background: var(--panel-strong);
  font-weight: 650;
}
.secondary-button:hover {
  border-color: var(--border-strong);
  background: #1b2330;
}
.secondary-button:active,
.icon-button:active,
.primary-button:active {
  transform: translateY(1px);
}
.hero {
  padding: clamp(18px, 3vw, 30px);
  border: 1px solid var(--border);
  border-radius: 22px;
  background: linear-gradient(160deg, rgba(24, 31, 43, 0.94), rgba(15, 20, 29, 0.94));
  box-shadow: var(--shadow);
}
.hero-copy {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 20px;
  margin-bottom: 16px;
}
.hero-copy h2 {
  margin: 0;
  font-size: clamp(18px, 2vw, 24px);
  letter-spacing: -0.025em;
}
.hero-copy p {
  max-width: 680px;
  margin: 5px 0 0;
  color: var(--muted);
  font-size: 13px;
  line-height: 1.65;
}
.definition-summary {
  flex: 0 0 auto;
  color: var(--muted);
  font-size: 12px;
  text-align: right;
}
.search-wrap {
  position: relative;
}
.search-box {
  display: flex;
  align-items: center;
  gap: 12px;
  min-height: 62px;
  padding: 0 14px 0 18px;
  border: 1px solid var(--border-strong);
  border-radius: 15px;
  background: #090c11;
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.035), 0 10px 30px rgba(0, 0, 0, 0.22);
}
.search-symbol {
  flex: 0 0 auto;
  color: var(--muted);
  font-size: 22px;
  line-height: 1;
}
#searchInput {
  width: 100%;
  min-width: 0;
  padding: 0;
  border: 0;
  color: var(--text);
  background: transparent;
  font-size: clamp(16px, 2vw, 20px);
}
#searchInput::placeholder {
  color: #687489;
}
.clear-search {
  min-width: 38px;
  height: 38px;
  border: 0;
  border-radius: 10px;
  color: var(--muted);
  background: transparent;
  cursor: pointer;
  opacity: 0;
  pointer-events: none;
}
.clear-search.visible {
  opacity: 1;
  pointer-events: auto;
}
.clear-search:hover {
  color: var(--text);
  background: rgba(255, 255, 255, 0.07);
}
.search-meta {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  min-height: 30px;
  margin-top: 8px;
  color: var(--muted);
  font-size: 12px;
}
.search-tips {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
kbd {
  display: inline-flex;
  align-items: center;
  min-width: 23px;
  min-height: 21px;
  padding: 0 6px;
  border: 1px solid var(--border-strong);
  border-bottom-color: #536079;
  border-radius: 6px;
  color: #c6cfdf;
  background: #171d27;
  font: inherit;
  font-size: 11px;
  justify-content: center;
}
.workspace {
  display: grid;
  grid-template-columns: minmax(0, 0.9fr) minmax(420px, 1.1fr);
  gap: 18px;
  margin-top: 18px;
}
.panel {
  min-width: 0;
  min-height: 520px;
  overflow: hidden;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: rgba(18, 23, 33, 0.91);
  box-shadow: 0 14px 45px rgba(0, 0, 0, 0.2);
}
.panel-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  min-height: 62px;
  padding: 0 18px;
  border-bottom: 1px solid var(--border);
  background: rgba(24, 31, 43, 0.72);
}
.panel-header h3 {
  margin: 0;
  font-size: 15px;
}
.panel-count {
  color: var(--muted);
  font-size: 12px;
}
.results,
.album-track-list {
  max-height: 610px;
  overflow: auto;
  overscroll-behavior: contain;
  scrollbar-color: #39465b transparent;
  scrollbar-width: thin;
}
.empty-state {
  display: grid;
  place-items: center;
  min-height: 430px;
  padding: 36px;
  text-align: center;
}
.empty-state-inner {
  max-width: 430px;
}
.empty-icon {
  display: grid;
  place-items: center;
  width: 54px;
  height: 54px;
  margin: 0 auto 16px;
  border: 1px solid var(--border);
  border-radius: 16px;
  color: var(--accent-strong);
  background: var(--accent-soft);
  font-size: 22px;
}
.empty-state h4 {
  margin: 0;
  font-size: 17px;
}
.empty-state p {
  margin: 8px 0 0;
  color: var(--muted);
  font-size: 13px;
  line-height: 1.7;
}
.quick-examples {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 8px;
  margin-top: 18px;
}
.example-chip {
  min-height: 34px;
  padding: 0 12px;
  border: 1px solid var(--border);
  border-radius: 999px;
  color: #c8d1df;
  background: var(--panel-strong);
  cursor: pointer;
}
.example-chip:hover {
  border-color: rgba(124, 156, 255, 0.55);
  color: var(--text);
  background: var(--accent-soft);
}
.result-section-title {
  position: sticky;
  top: 0;
  z-index: 2;
  display: flex;
  align-items: center;
  justify-content: space-between;
  min-height: 38px;
  padding: 0 16px;
  border-top: 1px solid var(--border);
  border-bottom: 1px solid var(--border);
  color: var(--muted);
  background: rgba(15, 20, 29, 0.96);
  backdrop-filter: blur(12px);
  font-size: 11px;
  font-weight: 750;
  letter-spacing: 0.06em;
  text-transform: uppercase;
}
.result-section-title:first-child {
  border-top: 0;
}
.album-result,
.track-result,
.album-track {
  width: 100%;
  border: 0;
  border-bottom: 1px solid rgba(41, 50, 66, 0.72);
  text-align: left;
  background: transparent;
  cursor: pointer;
}
.album-result:hover,
.track-result:hover,
.album-track:hover,
.track-result.keyboard-active {
  background: rgba(124, 156, 255, 0.09);
}
.album-result {
  display: grid;
  grid-template-columns: 42px minmax(0, 1fr) auto;
  align-items: center;
  gap: 12px;
  padding: 12px 16px;
}
.album-token {
  display: grid;
  place-items: center;
  width: 42px;
  height: 42px;
  border: 1px solid rgba(124, 156, 255, 0.32);
  border-radius: 11px;
  color: var(--accent-strong);
  background: var(--accent-soft);
  font-weight: 800;
}
.result-main,
.track-main,
.now-text {
  min-width: 0;
}
.result-title,
.track-title {
  overflow: hidden;
  color: var(--text);
  font-size: 14px;
  font-weight: 680;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.result-subtitle,
.track-subtitle {
  overflow: hidden;
  margin-top: 4px;
  color: var(--muted);
  font-size: 12px;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.result-arrow {
  color: var(--subtle);
}
.track-result,
.album-track {
  display: grid;
  grid-template-columns: 42px minmax(0, 1fr) auto;
  align-items: center;
  gap: 10px;
  min-height: 58px;
  padding: 8px 16px;
}
.track-number {
  color: var(--subtle);
  font-variant-numeric: tabular-nums;
  font-size: 12px;
  text-align: right;
}
.track-duration {
  color: var(--muted);
  font-variant-numeric: tabular-nums;
  font-size: 12px;
}
mark {
  padding: 0;
  color: inherit;
  background: rgba(246, 199, 106, 0.28);
  border-radius: 3px;
}
.album-header-card {
  padding: 22px 20px 18px;
  border-bottom: 1px solid var(--border);
  background:
    linear-gradient(135deg, rgba(124, 156, 255, 0.14), transparent 50%),
    var(--panel-soft);
}
.album-kicker {
  color: var(--accent-strong);
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}
.album-title {
  margin: 7px 0 0;
  font-size: clamp(19px, 2vw, 26px);
  line-height: 1.35;
  letter-spacing: -0.025em;
}
.album-meta {
  display: flex;
  align-items: center;
  gap: 9px;
  margin-top: 10px;
  color: var(--muted);
  font-size: 12px;
}
.album-meta-separator {
  color: var(--subtle);
}
.album-track.selected {
  background: rgba(124, 156, 255, 0.15);
  box-shadow: inset 3px 0 0 var(--accent);
}
.player {
  position: fixed;
  right: 16px;
  bottom: 16px;
  left: 16px;
  z-index: 20;
  width: min(1388px, calc(100% - 32px));
  min-height: 112px;
  margin: 0 auto;
  border: 1px solid var(--border-strong);
  border-radius: 18px;
  background: rgba(17, 22, 31, 0.95);
  box-shadow: 0 22px 75px rgba(0, 0, 0, 0.52);
  backdrop-filter: blur(24px);
}
.player-top {
  display: grid;
  grid-template-columns: minmax(210px, 1fr) auto minmax(260px, 1fr);
  align-items: center;
  gap: 20px;
  padding: 14px 18px 10px;
}
.now-playing {
  display: flex;
  align-items: center;
  gap: 12px;
  min-width: 0;
}
.now-token {
  display: grid;
  flex: 0 0 auto;
  place-items: center;
  width: 44px;
  height: 44px;
  border: 1px solid rgba(124, 156, 255, 0.38);
  border-radius: 12px;
  color: var(--accent-strong);
  background: var(--accent-soft);
  font-size: 19px;
}
.now-title,
.now-album {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.now-title {
  font-size: 14px;
  font-weight: 720;
}
.now-album {
  margin-top: 3px;
  color: var(--muted);
  font-size: 12px;
}
.controls {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}
.icon-button,
.primary-button {
  display: grid;
  place-items: center;
  width: 42px;
  height: 42px;
  padding: 0;
  background: var(--panel-strong);
}
.icon-button:hover:not(:disabled) {
  border-color: var(--border-strong);
  background: #212a38;
}
.primary-button {
  width: 48px;
  height: 48px;
  border-color: rgba(124, 156, 255, 0.6);
  color: #09101f;
  background: var(--accent-strong);
  font-size: 17px;
  font-weight: 900;
}
.primary-button:hover:not(:disabled) {
  background: #b0c0ff;
}
.icon-button:disabled,
.primary-button:disabled {
  cursor: not-allowed;
  opacity: 0.32;
}
.player-status {
  min-width: 0;
  text-align: right;
}
.operation-status {
  overflow: hidden;
  color: var(--text);
  font-size: 12px;
  font-weight: 650;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.boundary-status {
  overflow: hidden;
  margin-top: 4px;
  color: var(--muted);
  font-size: 11px;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.timeline {
  display: grid;
  grid-template-columns: 46px minmax(0, 1fr) 46px;
  align-items: center;
  gap: 10px;
  padding: 0 18px 14px;
  color: var(--muted);
  font-variant-numeric: tabular-nums;
  font-size: 11px;
}
.timeline-track {
  position: relative;
  height: 5px;
  overflow: hidden;
  border-radius: 999px;
  background: #2a3240;
}
.timeline-progress {
  width: 0;
  height: 100%;
  border-radius: inherit;
  background: linear-gradient(90deg, var(--accent), var(--success));
  transition: width 240ms linear;
}
.timeline-loop-marker {
  position: absolute;
  top: -2px;
  right: 7%;
  width: 2px;
  height: 9px;
  background: var(--warning);
}
.toast {
  position: fixed;
  right: 24px;
  bottom: 150px;
  z-index: 30;
  max-width: min(400px, calc(100% - 48px));
  padding: 12px 15px;
  border: 1px solid var(--border-strong);
  border-radius: 12px;
  color: var(--text);
  background: rgba(24, 31, 43, 0.97);
  box-shadow: 0 18px 55px rgba(0, 0, 0, 0.44);
  font-size: 13px;
  opacity: 0;
  transform: translateY(8px);
  pointer-events: none;
  transition: opacity 160ms ease, transform 160ms ease;
}
.toast.visible {
  opacity: 1;
  transform: translateY(0);
}
@media (max-width: 980px) {
  .workspace {
    grid-template-columns: 1fr;
  }
  .panel {
    min-height: 0;
  }
  .results,
  .album-track-list {
    max-height: 520px;
  }
  .player-top {
    grid-template-columns: minmax(0, 1fr) auto;
  }
  .player-status {
    grid-column: 1 / -1;
    text-align: left;
  }
}
@media (max-width: 700px) {
  .app {
    width: min(100% - 20px, 1420px);
    padding-top: 14px;
    padding-bottom: 218px;
  }
  .header {
    align-items: flex-start;
    flex-direction: column;
    margin-bottom: 14px;
  }
  .subtitle {
    margin-left: 0;
  }
  .header-actions {
    width: 100%;
    justify-content: flex-start;
  }
  .hero {
    padding: 16px;
    border-radius: 16px;
  }
  .hero-copy {
    align-items: flex-start;
    flex-direction: column;
  }
  .definition-summary {
    text-align: left;
  }
  .search-box {
    min-height: 56px;
  }
  .search-meta {
    align-items: flex-start;
    flex-direction: column;
    gap: 5px;
  }
  .search-tips {
    white-space: normal;
  }
  .workspace {
    gap: 12px;
    margin-top: 12px;
  }
  .panel-header {
    min-height: 54px;
  }
  .player {
    right: 8px;
    bottom: 8px;
    left: 8px;
    width: calc(100% - 16px);
  }
  .player-top {
    grid-template-columns: 1fr;
    gap: 10px;
    padding: 12px 12px 8px;
  }
  .controls {
    grid-row: 2;
  }
  .player-status {
    grid-row: 3;
  }
  .timeline {
    padding: 0 12px 12px;
  }
  .album-result,
  .track-result,
  .album-track {
    padding-right: 12px;
    padding-left: 12px;
  }
}
</style>
</head>
<body>
<div class="app">
  <header class="header">
    <div class="brand">
      <div class="brand-line">
        <div class="brand-mark">∞</div>
        <h1>ゲーム音楽ループプレイヤー</h1>
      </div>
      <p class="subtitle">定義から曲を探し、端末内の音源を無限ループ再生するためのUI試作</p>
    </div>
    <div class="header-actions">
      <div id="folderStatus" class="status-pill">
        <span class="status-dot"></span>
        <span>音源フォルダ未読込</span>
      </div>
      <button id="loadFolderButton" class="secondary-button" type="button">音源フォルダを読み込む</button>
    </div>
  </header>

  <section class="hero">
    <div class="hero-copy">
      <div>
        <h2>アルバム名または曲名で検索</h2>
        <p>既存の音楽プレイヤーで見つけた名前を一部入力し、定義に含まれるループ可能曲だけを絞り込みます。空白で区切ると複数語をすべて含む候補に絞れます。</p>
      </div>
      <div id="definitionSummary" class="definition-summary"></div>
    </div>
    <div class="search-wrap">
      <div class="search-box">
        <span class="search-symbol" aria-hidden="true">⌕</span>
        <input id="searchInput" type="search" autocomplete="off" spellcheck="false" placeholder="例: ニーア 夏ノ雪 / DRAGOON 第一章">
        <button id="clearSearchButton" class="clear-search" type="button" aria-label="検索をクリア">×</button>
      </div>
      <div class="search-meta">
        <span id="searchStatus">曲名・アルバム名の一部を入力してください</span>
        <span class="search-tips"><kbd>↑</kbd> <kbd>↓</kbd> 候補移動　<kbd>Enter</kbd> 選択　<kbd>Esc</kbd> クリア</span>
      </div>
    </div>
  </section>

  <main class="workspace">
    <section class="panel" aria-label="検索結果">
      <div class="panel-header">
        <h3>検索結果</h3>
        <span id="resultCount" class="panel-count">入力待ち</span>
      </div>
      <div id="results" class="results"></div>
    </section>

    <section class="panel" aria-label="選択中のアルバム">
      <div class="panel-header">
        <h3>アルバム</h3>
        <span id="albumPanelCount" class="panel-count"></span>
      </div>
      <div id="albumPanel"></div>
    </section>
  </main>
</div>

<section class="player" aria-label="プレイヤー操作">
  <div class="player-top">
    <div class="now-playing">
      <div class="now-token" aria-hidden="true">∞</div>
      <div class="now-text">
        <div id="nowTitle" class="now-title">曲が選択されていません</div>
        <div id="nowAlbum" class="now-album">検索結果またはアルバム内の曲を選択してください</div>
      </div>
    </div>
    <div class="controls">
      <button id="previousButton" class="icon-button" type="button" aria-label="前の曲" title="前の曲">◀</button>

const state = {
  query: "",
  selectedAlbumId: albums[0]?.id ?? null,
  selectedTrackId: null,
  playback: "stopped",
  elapsed: 0,
  keyboardItems: [],
  keyboardIndex: -1,
  timerId: null,
  folderLoaded: false,
};

const elements = {
  searchInput: document.querySelector("#searchInput"),
  clearSearchButton: document.querySelector("#clearSearchButton"),
  searchStatus: document.querySelector("#searchStatus"),
  resultCount: document.querySelector("#resultCount"),
  results: document.querySelector("#results"),
  albumPanel: document.querySelector("#albumPanel"),
  albumPanelCount: document.querySelector("#albumPanelCount"),
  definitionSummary: document.querySelector("#definitionSummary"),
  folderStatus: document.querySelector("#folderStatus"),
  loadFolderButton: document.querySelector("#loadFolderButton"),
  nowTitle: document.querySelector("#nowTitle"),
  nowAlbum: document.querySelector("#nowAlbum"),
  operationStatus: document.querySelector("#operationStatus"),
  boundaryStatus: document.querySelector("#boundaryStatus"),
  previousButton: document.querySelector("#previousButton"),
  playButton: document.querySelector("#playButton"),
  stopButton: document.querySelector("#stopButton"),
  nextButton: document.querySelector("#nextButton"),
  currentTime: document.querySelector("#currentTime"),
  totalTime: document.querySelector("#totalTime"),
  timelineProgress: document.querySelector("#timelineProgress"),
  toast: document.querySelector("#toast"),
};

const allTracks = albums.flatMap((album) => album.tracks.map((track, index) => ({
  ...track,
  albumId: album.id,
  albumTitle: album.title,
  albumTrackIndex: index,
})));

const totalTrackCount = allTracks.length;
elements.definitionSummary.textContent = `サンプル定義: ${albums.length.toLocaleString("ja-JP")}アルバム / ${totalTrackCount.toLocaleString("ja-JP")}曲`;

const normalizeText = (value) => value
  .normalize("NFKC")
  .toLocaleLowerCase("ja-JP")
  .replace(/[\s　]+/g, "")
  .replace(/[・･_\-–—/\\()[\]【】『』「」:：,，.．…&＆]/g, "");

const tokenizeQuery = (query) => query
  .trim()
  .split(/[\s　]+/)
  .map(normalizeText)
  .filter(Boolean);

const formatDuration = (seconds) => {
  const safeSeconds = Math.max(0, Math.floor(seconds || 0));
  const minutes = Math.floor(safeSeconds / 60);
  const remainingSeconds = String(safeSeconds % 60).padStart(2, "0");
  return `${minutes}:${remainingSeconds}`;
};

const escapeHTML = (value) => String(value)
  .replaceAll("&", "&amp;")
  .replaceAll("<", "&lt;")
  .replaceAll(">", "&gt;")
  .replaceAll('"', "&quot;")
  .replaceAll("'", "&#039;");

const selectedAlbum = () => albums.find((album) => album.id === state.selectedAlbumId) ?? null;

const selectedTrack = () => {
  const album = selectedAlbum();
  return album?.tracks.find((track) => track.id === state.selectedTrackId) ?? null;
};

const showToast = (message) => {
  elements.toast.textContent = message;
  elements.toast.classList.add("visible");
  window.clearTimeout(showToast.timeoutId);
  showToast.timeoutId = window.setTimeout(() => {
    elements.toast.classList.remove("visible");
  }, 2300);
};

const setFolderLoaded = () => {
  state.folderLoaded = true;
  elements.folderStatus.classList.add("loaded");
  elements.folderStatus.querySelector("span:last-child").textContent = "音源フォルダ読込済み（デモ）";
  elements.loadFolderButton.textContent = "フォルダを変更";
  showToast("デモとして音源フォルダを読み込み済みにしました。実装版ではローカルファイルと定義を突合します。");
};

const getSearchResults = () => {
  const tokens = tokenizeQuery(state.query);
  if (tokens.length === 0) {
    return { albumMatches: [], trackMatches: [] };
  }

  const albumMatches = albums.filter((album) => {
    const normalizedAlbum = normalizeText(album.title);
    return tokens.every((token) => normalizedAlbum.includes(token));
  });

  const trackMatches = allTracks.filter((track) => {
    const searchable = normalizeText(`${track.albumTitle} ${track.title}`);
    return tokens.every((token) => searchable.includes(token));
  });

  trackMatches.sort((left, right) => {
    const leftTitle = normalizeText(left.title);
    const rightTitle = normalizeText(right.title);
    const firstToken = tokens[0] ?? "";
    const leftStarts = leftTitle.startsWith(firstToken) ? 0 : 1;
    const rightStarts = rightTitle.startsWith(firstToken) ? 0 : 1;
    return leftStarts - rightStarts || left.albumTitle.localeCompare(right.albumTitle, "ja") || left.albumTrackIndex - right.albumTrackIndex;
  });

  return { albumMatches, trackMatches };
};

const renderEmptyResults = () => {
  elements.resultCount.textContent = "入力待ち";
  elements.searchStatus.textContent = "曲名・アルバム名の一部を入力してください";
  elements.results.innerHTML = `
    <div class="empty-state">
      <div class="empty-state-inner">
        <div class="empty-icon">⌕</div>
        <h4>既存プレイヤーで見つけた名前を入力</h4>
        <p>アルバム名でも曲名でも検索できます。複数語を空白で区切ると、アルバム名と曲名をまたいだ絞り込みもできます。</p>
        <div class="quick-examples">
          <button class="example-chip" type="button" data-example="ニーア 夏">ニーア 夏</button>
          <button class="example-chip" type="button" data-example="DRAGOON 第一章">DRAGOON 第一章</button>
          <button class="example-chip" type="button" data-example="Weight of the World">Weight of the World</button>
        </div>
      </div>
    </div>`;
  state.keyboardItems = [];
  state.keyboardIndex = -1;
};

const renderResults = () => {
  state.query = elements.searchInput.value;
  elements.clearSearchButton.classList.toggle("visible", state.query.length > 0);

  if (tokenizeQuery(state.query).length === 0) {
    renderEmptyResults();
    return;
  }

  const { albumMatches, trackMatches } = getSearchResults();
  const totalMatches = albumMatches.length + trackMatches.length;
  const limitedTracks = trackMatches.slice(0, 120);
  elements.resultCount.textContent = `${totalMatches.toLocaleString("ja-JP")}件`;
  elements.searchStatus.textContent = totalMatches === 0
    ? `「${state.query}」に一致する定義はありません`
    : `「${state.query}」で ${albumMatches.length.toLocaleString("ja-JP")}アルバム / ${trackMatches.length.toLocaleString("ja-JP")}曲`;

  if (totalMatches === 0) {
    elements.results.innerHTML = `
      <div class="empty-state">
        <div class="empty-state-inner">
          <div class="empty-icon">0</div>
          <h4>一致する曲がありません</h4>
          <p>定義に含まれない曲、またはスコア基準で除外された曲は検索結果に現れない想定です。</p>
        </div>
      </div>`;
    state.keyboardItems = [];
    state.keyboardIndex = -1;
    return;
  }

  const albumHTML = albumMatches.length === 0 ? "" : `
    <div class="result-section-title"><span>アルバム名に一致</span><span>${albumMatches.length}件</span></div>
    ${albumMatches.slice(0, 20).map((album) => `
      <button class="album-result keyboard-item" type="button" data-kind="album" data-album-id="${album.id}">
        <span class="album-token">AL</span>
        <span class="result-main">
          <span class="result-title">${escapeHTML(album.title)}</span>
          <span class="result-subtitle">${album.tracks.length}曲を表示</span>
        </span>
        <span class="result-arrow">›</span>
      </button>`).join("")}`;

  const trackHTML = limitedTracks.length === 0 ? "" : `
    <div class="result-section-title"><span>曲名・アルバム名に一致</span><span>${trackMatches.length > limitedTracks.length ? `上位${limitedTracks.length}件` : `${limitedTracks.length}件`}</span></div>
    ${limitedTracks.map((track) => `
      <button class="track-result keyboard-item" type="button" data-kind="track" data-album-id="${track.albumId}" data-track-id="${track.id}">
        <span class="track-number">${String(track.albumTrackIndex + 1).padStart(2, "0")}</span>
        <span class="track-main">
          <span class="track-title">${escapeHTML(track.title)}</span>
          <span class="track-subtitle">${escapeHTML(track.albumTitle)}</span>
        </span>
        <span class="track-duration">${formatDuration(track.duration)}</span>
      </button>`).join("")}`;

  elements.results.innerHTML = albumHTML + trackHTML;
  state.keyboardItems = [...elements.results.querySelectorAll(".keyboard-item")];
  state.keyboardIndex = -1;
};

const renderAlbum = () => {
  const album = selectedAlbum();
  if (!album) {
    elements.albumPanelCount.textContent = "";
    elements.albumPanel.innerHTML = `
      <div class="empty-state">
        <div class="empty-state-inner">
          <div class="empty-icon">AL</div>
          <h4>アルバムが選択されていません</h4>
          <p>検索結果のアルバムまたは曲を選択してください。</p>
        </div>
      </div>`;
    return;
  }

  elements.albumPanelCount.textContent = `${album.tracks.length}曲`;
  elements.albumPanel.innerHTML = `
    <div class="album-header-card">
      <div class="album-kicker">Selected Album</div>
      <h4 class="album-title">${escapeHTML(album.title)}</h4>
      <div class="album-meta">
        <span>${album.tracks.length}曲</span>
        <span class="album-meta-separator">•</span>
        <span>定義に含まれる曲のみ表示</span>
      </div>
    </div>
    <div class="album-track-list">
      ${album.tracks.map((track, index) => `
        <button class="album-track ${track.id === state.selectedTrackId ? "selected" : ""}" type="button" data-track-id="${track.id}">
          <span class="track-number">${String(index + 1).padStart(2, "0")}</span>
          <span class="track-main">
            <span class="track-title">${escapeHTML(track.title)}</span>
            <span class="track-subtitle">${escapeHTML(track.fileName)}</span>
          </span>
          <span class="track-duration">${formatDuration(track.duration)}</span>
        </button>`).join("")}
    </div>`;
};

const updateBoundaryState = () => {
  const album = selectedAlbum();
  const track = selectedTrack();
  if (!album || !track) {
    elements.previousButton.disabled = true;
    elements.nextButton.disabled = true;
    elements.boundaryStatus.textContent = "曲を選択すると前後の移動可否を表示します";
    return;
  }

  const index = album.tracks.findIndex((candidate) => candidate.id === track.id);
  const isFirst = index === 0;
  const isLast = index === album.tracks.length - 1;
  elements.previousButton.disabled = isFirst;
  elements.nextButton.disabled = isLast;

  if (isFirst && isLast) {
    elements.boundaryStatus.textContent = "このアルバムにはこの1曲だけが登録されています";
  } else if (isFirst) {
    elements.boundaryStatus.textContent = "このアルバムの先頭です。前の曲はありません";
  } else if (isLast) {
    elements.boundaryStatus.textContent = "このアルバムの最後です。次の曲はありません";
  } else {
    elements.boundaryStatus.textContent = `${index + 1} / ${album.tracks.length}曲目`;
  }
};

const updatePlayer = () => {
  const album = selectedAlbum();
  const track = selectedTrack();
  const hasTrack = Boolean(album && track);
  elements.playButton.disabled = !hasTrack;
  elements.stopButton.disabled = !hasTrack || state.playback === "stopped";

  if (!hasTrack) {
    elements.nowTitle.textContent = "曲が選択されていません";
    elements.nowAlbum.textContent = "検索結果またはアルバム内の曲を選択してください";
    elements.operationStatus.textContent = "待機中";
    elements.currentTime.textContent = "0:00";
    elements.totalTime.textContent = "0:00";
    elements.timelineProgress.style.width = "0%";
    elements.playButton.textContent = "▶";
    elements.playButton.setAttribute("aria-label", "再生");
    updateBoundaryState();
    return;
  }

  elements.nowTitle.textContent = track.title;
  elements.nowAlbum.textContent = album.title;
  elements.totalTime.textContent = formatDuration(track.duration);
  elements.currentTime.textContent = formatDuration(state.elapsed);
  elements.timelineProgress.style.width = `${Math.min(100, (state.elapsed / Math.max(1, track.duration)) * 100)}%`;
  elements.playButton.textContent = state.playback === "playing" ? "Ⅱ" : "▶";
  elements.playButton.setAttribute("aria-label", state.playback === "playing" ? "一時停止" : "再生");
  elements.operationStatus.textContent = {
    playing: "無限ループ再生中（デモ）",
    paused: "一時停止中",
    stopped: "停止中 — 再生位置は先頭へ戻りました",
  }[state.playback];
  updateBoundaryState();
};

const selectAlbum = (albumId) => {
  state.selectedAlbumId = albumId;
  const album = selectedAlbum();
  if (!album?.tracks.some((track) => track.id === state.selectedTrackId)) {
    state.selectedTrackId = null;
    state.playback = "stopped";
    state.elapsed = 0;
  }
  renderAlbum();
  updatePlayer();
};

const selectTrack = (albumId, trackId) => {
  state.selectedAlbumId = albumId;
  state.selectedTrackId = trackId;
  state.playback = "stopped";
  state.elapsed = 0;
  renderAlbum();
  updatePlayer();
  const track = selectedTrack();
  if (track) {
    showToast(`「${track.title}」を選択しました。再生ボタンで開始します。`);
  }
};

const playOrPause = () => {
  if (!selectedTrack()) {
    showToast("先に曲を選択してください。");
    return;
  }
  if (!state.folderLoaded) {
    showToast("実装版では先に音源フォルダを読み込みます。この試作では操作を続行します。");
  }
  state.playback = state.playback === "playing" ? "paused" : "playing";
  updatePlayer();
};

const stopPlayback = () => {
  if (!selectedTrack()) {
    return;
  }
  state.playback = "stopped";
  state.elapsed = 0;
  updatePlayer();
  showToast("停止しました。再生位置を先頭へ戻しました。");
};

const moveTrack = (direction) => {
  const album = selectedAlbum();
  const track = selectedTrack();
  if (!album || !track) {
    showToast("先に曲を選択してください。");
    return;
  }
  const index = album.tracks.findIndex((candidate) => candidate.id === track.id);
  const nextIndex = index + direction;
  if (nextIndex < 0) {
    showToast("このアルバムの先頭です。前の曲はありません。");
    return;
  }
  if (nextIndex >= album.tracks.length) {
    showToast("このアルバムの最後です。次の曲はありません。");
    return;
  }
  const wasPlaying = state.playback === "playing";
  state.selectedTrackId = album.tracks[nextIndex].id;
  state.elapsed = 0;
  state.playback = wasPlaying ? "playing" : "stopped";
  renderAlbum();
  updatePlayer();
  showToast(`${direction > 0 ? "次" : "前"}の曲「${album.tracks[nextIndex].title}」へ移動しました。`);
};

const updateKeyboardSelection = () => {
  state.keyboardItems.forEach((item, index) => {
    item.classList.toggle("keyboard-active", index === state.keyboardIndex);
  });
  state.keyboardItems[state.keyboardIndex]?.scrollIntoView({ block: "nearest" });
};

elements.searchInput.addEventListener("input", renderResults);
elements.searchInput.addEventListener("keydown", (event) => {
  if (event.key === "Escape") {
    elements.searchInput.value = "";
    renderResults();
    return;
  }
  if (state.keyboardItems.length === 0) {
    return;
  }
  if (event.key === "ArrowDown") {
    event.preventDefault();
    state.keyboardIndex = Math.min(state.keyboardItems.length - 1, state.keyboardIndex + 1);
    updateKeyboardSelection();
  } else if (event.key === "ArrowUp") {
    event.preventDefault();
    state.keyboardIndex = Math.max(0, state.keyboardIndex - 1);
    updateKeyboardSelection();
  } else if (event.key === "Enter" && state.keyboardIndex >= 0) {
    event.preventDefault();
    state.keyboardItems[state.keyboardIndex].click();
  }
});

elements.clearSearchButton.addEventListener("click", () => {
  elements.searchInput.value = "";
  elements.searchInput.focus();
  renderResults();
});

elements.results.addEventListener("click", (event) => {
  const example = event.target.closest("[data-example]");
  if (example) {
    elements.searchInput.value = example.dataset.example;
    elements.searchInput.focus();
    renderResults();
    return;
  }
  const item = event.target.closest("[data-kind]");
  if (!item) {
    return;
  }
  if (item.dataset.kind === "album") {
    selectAlbum(item.dataset.albumId);
  } else {
    selectTrack(item.dataset.albumId, item.dataset.trackId);
  }
});

elements.albumPanel.addEventListener("click", (event) => {
  const trackButton = event.target.closest("[data-track-id]");
  if (!trackButton) {
    return;
  }
  selectTrack(state.selectedAlbumId, trackButton.dataset.trackId);
});

elements.loadFolderButton.addEventListener("click", setFolderLoaded);
elements.playButton.addEventListener("click", playOrPause);
elements.stopButton.addEventListener("click", stopPlayback);
elements.previousButton.addEventListener("click", () => moveTrack(-1));
elements.nextButton.addEventListener("click", () => moveTrack(1));

state.timerId = window.setInterval(() => {
  const track = selectedTrack();
  if (state.playback !== "playing" || !track) {
    return;
  }
  state.elapsed += 0.5;
  const mockLoopEnd = Math.max(5, track.duration * 0.93);
  if (state.elapsed >= mockLoopEnd) {
    state.elapsed = Math.min(2, track.duration * 0.02);
    elements.operationStatus.textContent = "ループ終端から開始位置へ戻りました（デモ）";
  }
  updatePlayer();
}, 500);

renderResults();
renderAlbum();
updatePlayer();
</script>
</body>
</html>
